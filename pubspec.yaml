name: xaneo
description: "Xaneo PC - Desktop application with onboarding"
publish_to: 'none'
version: 1.0.14+14

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # HTTP & gRPC requests
  http: ^1.1.0
  dio: ^5.4.0
  dio_cookie_manager: ^3.0.0
  cookie_jar: ^4.0.8
  grpc: ^4.1.0
  protobuf: ^3.1.0
  fixnum: ^1.1.0



  
  # Toast notifications
  fluttertoast: ^8.0.8
  
  # Internationalization
  intl: ^0.20.2
  
  # Shared preferences for storing app state
  shared_preferences: ^2.2.2
  
  # Provider for state management
  provider: ^6.1.2
  
  # Lottie animations
  lottie: ^3.1.3
  
  # SVG support
  flutter_svg: ^2.0.7
  
  # Package info for getting app version
  package_info_plus: ^8.0.0
  
  # Window manager for custom title bar
  window_manager: ^0.3.9
  
  # Image picker for avatar selection
  image_picker: ^1.0.7
  file_picker: ^11.0.2
  
  # URL launcher for opening links
  url_launcher: ^6.1.10
  ffi: ^2.1.0
  cryptography: ^2.9.0
  pointycastle: ^3.7.3
  x25519: ^0.1.1
  argon2: ^1.0.1

  # Voice message playback (just_audio + media_kit backend for desktop)
  just_audio: ^0.10.5
  just_audio_media_kit: ^2.0.6
  font_awesome_flutter: ^11.0.0
  record: ^7.1.0
  path_provider: ^2.1.6
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  media_kit_libs_linux: ^1.1.4
  camera: ^0.12.0+1
  livekit_client: ^2.1.0
  desktop_multi_window: ^0.2.0
  local_notifier: ^0.1.6
  tray_manager: ^0.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fastforge: ^0.6.6

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/animations/
    - assets/logo.png
    - assets/tray_icon.ico
    - assets/sounds/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
