name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: xaneo_pc
  FLUTTER_VERSION: '3.32.2'
  FLUTTER_CHANNEL: 'stable'

jobs:

# ==========================================================
#  WINDOWS — zip архив с .exe
# ==========================================================
  build-windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:-v2'

      - name: Run Flutter Doctor
        run: flutter doctor -v

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release

      - name: Bundle VC++ Redistributable (Main App)
        shell: pwsh
        run: |
          $ReleaseDir = "build\windows\x64\runner\Release"
          Copy-Item "C:\Windows\System32\msvcp140.dll" -Destination $ReleaseDir
          Copy-Item "C:\Windows\System32\vcruntime140.dll" -Destination $ReleaseDir
          Copy-Item "C:\Windows\System32\vcruntime140_1.dll" -Destination $ReleaseDir

      - name: Archive Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "dist\xaneo_pc-${{ github.ref_name }}-windows-x64.zip"

      - name: Prepare and Build Custom Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "installer_app\assets" | Out-Null
          Copy-Item "dist\xaneo_pc-${{ github.ref_name }}-windows-x64.zip" -Destination "installer_app\assets\xaneo_pc.zip"
          Set-Location -Path "installer_app"
          flutter pub get
          flutter build windows --release

      - name: Bundle VC++ Redistributable (Installer)
        shell: pwsh
        run: |
          $ReleaseDir = "installer_app\build\windows\x64\runner\Release"
          Copy-Item "C:\Windows\System32\msvcp140.dll" -Destination $ReleaseDir
          Copy-Item "C:\Windows\System32\vcruntime140.dll" -Destination $ReleaseDir
          Copy-Item "C:\Windows\System32\vcruntime140_1.dll" -Destination $ReleaseDir

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress

      - name: Build 100% Silent NSIS Wrapper
        shell: pwsh
        run: |
          $Version = "${{ github.ref_name }}".TrimStart("v")
          if ([string]::IsNullOrWhiteSpace($Version) -or $Version -eq "main") { $Version = "1.0.0" }

          # Clean and format version for VIProductVersion (requires 4-part X.Y.Z.W format)
          $CleanVersion = ($Version -replace '[^\d\.]', '')
          if ([string]::IsNullOrWhiteSpace($CleanVersion)) {
              $NsisVersion = "1.0.0.0"
          } else {
              $Parts = $CleanVersion.Split('.')
              while ($Parts.Count -lt 4) {
                  $Parts += "0"
              }
              $NsisVersion = ($Parts[0..3] -join '.')
          }

          if (Get-Command makensis -ErrorAction SilentlyContinue) {
              makensis uninstaller.nsi
              makensis /DVERSION="$NsisVersion" /DDISPLAY_VERSION="$Version" installer.nsi
          } elseif (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") {
              & "C:\Program Files (x86)\NSIS\makensis.exe" uninstaller.nsi
              & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION="$NsisVersion" /DDISPLAY_VERSION="$Version" installer.nsi
          } elseif (Test-Path "C:\Program Files\NSIS\makensis.exe") {
              & "C:\Program Files\NSIS\makensis.exe" uninstaller.nsi
              & "C:\Program Files\NSIS\makensis.exe" /DVERSION="$NsisVersion" /DDISPLAY_VERSION="$Version" installer.nsi
          } else {
              Write-Error "makensis.exe not found! Make sure NSIS is installed correctly."
              exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*.zip
            dist/*.exe
          retention-days: 7


# ==========================================================
#  LINUX — .AppImage  .deb  .rpm
# ==========================================================
  build-linux:
    name: Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            cmake ninja-build clang pkg-config \
            libgtk-3-dev libglib2.0-dev \
            libblkid-dev liblzma-dev \
            libmpv-dev libmpv2 \
            rpm dpkg-dev fakeroot \
            wget file

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release
      - run: mkdir -p dist

      - name: Build deb
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9] ]]; then VERSION="0.0.0-${VERSION}"; fi
          BUNDLE="build/linux/x64/release/bundle"
          PKG="dist/deb-build"

          mkdir -p "$PKG/DEBIAN"
          mkdir -p "$PKG/opt/xaneo-pc"
          mkdir -p "$PKG/usr/share/applications"
          mkdir -p "$PKG/usr/share/icons/hicolor/256x256/apps"
          mkdir -p "$PKG/usr/bin"

          cp -r "$BUNDLE"/. "$PKG/opt/xaneo-pc/"

          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=Xaneo PC' \
            'Comment=Desktop application with onboarding' \
            'Exec=/opt/xaneo-pc/xaneo_pc_new' \
            'Icon=xaneo_pc' \
            'Categories=Utility;' \
            > "$PKG/usr/share/applications/xaneo_pc.desktop"

          if [ -f "AppDir/xaneo_pc.png" ]; then
            cp AppDir/xaneo_pc.png "$PKG/usr/share/icons/hicolor/256x256/apps/"
          fi

          ln -sf /opt/xaneo-pc/xaneo_pc_new "$PKG/usr/bin/xaneo-pc"

          INSTALLED_SIZE=$(du -sk "$PKG/opt/xaneo-pc" | cut -f1)

          python3 - <<PYEOF
          import os, textwrap
          version = os.environ.get('VERSION', '$VERSION')
          size    = os.environ.get('INSTALLED_SIZE', '$INSTALLED_SIZE')
          pkg     = os.environ.get('PKG', '$PKG')
          control = textwrap.dedent(f"""
              Package: xaneo-pc
              Version: {version}
              Architecture: amd64
              Maintainer: Xaneo <info@xaneo.com>
              Installed-Size: {size}
              Depends: libgtk-3-0, libglib2.0-0, libmpv2 | libmpv1
              Section: utils
              Priority: optional
              Homepage: https://xaneo.com
              Description: Xaneo PC - Desktop application with onboarding
               Xaneo PC is a desktop application with onboarding features.
          """).lstrip()
          open(f"{pkg}/DEBIAN/control", "w").write(control)
          postinst = "#!/bin/bash\nupdate-desktop-database /usr/share/applications || true\ngtk-update-icon-cache /usr/share/icons/hicolor || true\n"
          open(f"{pkg}/DEBIAN/postinst", "w").write(postinst)
          os.chmod(f"{pkg}/DEBIAN/postinst", 0o755)
          PYEOF

          fakeroot dpkg-deb --build "$PKG" "dist/xaneo_pc_${VERSION}_amd64.deb"

      - name: Build rpm
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9] ]]; then VERSION="0.0.0_${VERSION}"; fi
          VERSION="${VERSION//-/_}"
          BUNDLE="build/linux/x64/release/bundle"
          RPM_ROOT="$HOME/rpmbuild"

          mkdir -p "$RPM_ROOT"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

          BUILDROOT="$RPM_ROOT/BUILDROOT/xaneo-pc-${VERSION}-1.x86_64"
          mkdir -p "$BUILDROOT/opt/xaneo-pc"
          mkdir -p "$BUILDROOT/usr/share/applications"
          mkdir -p "$BUILDROOT/usr/bin"

          cp -r "$BUNDLE"/. "$BUILDROOT/opt/xaneo-pc/"

          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=Xaneo PC' \
            'Comment=Desktop application with onboarding' \
            'Exec=/opt/xaneo-pc/xaneo_pc_new' \
            'Icon=xaneo_pc' \
            'Categories=Utility;' \
            > "$BUILDROOT/usr/share/applications/xaneo_pc.desktop"

          ln -sf /opt/xaneo-pc/xaneo_pc_new "$BUILDROOT/usr/bin/xaneo-pc"

          DATE=$(date +'%a %b %d %Y')

          python3 - <<PYEOF
          import os
          version   = '$VERSION'
          date      = '$DATE'
          rpm_root  = '$RPM_ROOT'
          buildroot = '$BUILDROOT'
          spec = f"""Name:           xaneo-pc
          Version:        {version}
          Release:        1%{{?dist}}
          Summary:        Xaneo PC - Desktop application with onboarding
          License:        Proprietary
          URL:            https://xaneo.com
          BuildArch:      x86_64

          Requires:       gtk3, glib2, mpv-libs

          %description
          Xaneo PC is a desktop application with onboarding features.

          %files
          /opt/xaneo-pc/
          /usr/share/applications/xaneo_pc.desktop
          /usr/bin/xaneo-pc

          %post
          update-desktop-database /usr/share/applications || true

          %changelog
          * {date} CI Build <ci@xaneo.com> - {version}-1
          - Automated build
          """
          open(f"{rpm_root}/SPECS/xaneo-pc.spec", "w").write(spec)
          PYEOF

          rpmbuild -bb \
            --define "_topdir $RPM_ROOT" \
            --buildroot "$BUILDROOT" \
            "$RPM_ROOT/SPECS/xaneo-pc.spec"

          RPM_FILE=$(find "$RPM_ROOT/RPMS/x86_64" -name "*.rpm" | head -1)
          cp "$RPM_FILE" "dist/xaneo_pc-${VERSION}-1.x86_64.rpm"

      - name: Build AppImage
        run: |
          BUNDLE="build/linux/x64/release/bundle"
          APPDIR="AppImageBuild/xaneo_pc.AppDir"

          # Собираем AppDir по FHS-структуре, которую понимает linuxdeploy
          rm -rf AppImageBuild
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/lib"
          mkdir -p "$APPDIR/usr/share/applications"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          # Бинарник + ассеты + плагины Flutter
          cp -r "$BUNDLE"/. "$APPDIR/usr/bin/"

          # .desktop (генерим в CI, не полагаемся на committed AppDir/)
          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=Xaneo PC' \
            'Comment=Desktop application with onboarding' \
            'Exec=xaneo_pc_new' \
            'Icon=xaneo_pc' \
            'Categories=Network;' \
            'Terminal=false' \
            > "$APPDIR/usr/share/applications/xaneo_pc.desktop"

          # Реальная иконка (committed AppDir/xaneo_pc.png — заглушка 1x1)
          cp macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_256.png \
            "$APPDIR/usr/share/icons/hicolor/256x256/apps/xaneo_pc.png"

          # linuxdeploy сам вложит libmpv.so.2 и её транзитивные зависимости
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

          LIBMPV=$(ldconfig -p | awk '/libmpv\.so\.2/ {print $NF; exit}')
          echo "Bundling libmpv from: $LIBMPV"

          export OUTPUT="dist/xaneo_pc-${{ github.ref_name }}-x86_64.AppImage"
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir "$APPDIR" \
            --executable "$APPDIR/usr/bin/xaneo_pc_new" \
            --library "$LIBMPV" \
            --desktop-file "$APPDIR/usr/share/applications/xaneo_pc.desktop" \
            --icon-file "$APPDIR/usr/share/icons/hicolor/256x256/apps/xaneo_pc.png" \
            --output appimage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          retention-days: 7


# ==========================================================
#  MACOS — .dmg
# ==========================================================
  build-macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release

      - name: Create dmg
        run: |
          mkdir -p dist
          hdiutil create \
            -volname "Xaneo PC" \
            -srcfolder "build/macos/Build/Products/Release/xaneo_pc.app" \
            -ov -format UDZO \
            "dist/xaneo_pc-${{ github.ref_name }}-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/xaneo_pc-${{ github.ref_name }}-macos.dmg
          retention-days: 7


# ==========================================================
#  RELEASE — публикуем GitHub Release
# ==========================================================
  release:
    name: GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest-build' }}
          name: "Xaneo PC ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
