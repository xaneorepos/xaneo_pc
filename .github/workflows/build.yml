name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build (e.g. 1.2.0)'
        required: false
        default: ''

permissions:
  contents: write

env:
  APP_NAME: xaneo
  FLUTTER_VERSION: '3.44.4'
  FLUTTER_CHANNEL: 'stable'

jobs:

# ==========================================================
#  WINDOWS — zip архив с .exe
# ==========================================================
  build-windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:-v2'

      - name: Run Flutter Doctor
        run: flutter doctor -v

      - name: Set App Version in pubspec.yaml
        shell: pwsh
        run: |
          $Ver = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($Ver)) { $Ver = "${{ github.ref_name }}" }
          $Ver = $Ver.TrimStart("v")
          if ($Ver -match '^\d+\.\d+') {
            Write-Host "Setting app version in pubspec.yaml to: $Ver+${{ github.run_number }}"
            (Get-Content pubspec.yaml) -replace '^version: .*', "version: $Ver+${{ github.run_number }}" | Set-Content pubspec.yaml
          }

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release

      - name: Bundle VC++ Redistributable (Main App)
        shell: pwsh
        run: |
          $ReleaseDir = "build\windows\x64\runner\Release"
          Copy-Item "C:\Windows\System32\msvcp140.dll" -Destination $ReleaseDir
          Copy-Item "C:\Windows\System32\vcruntime140.dll" -Destination $ReleaseDir
          Copy-Item "C:\Windows\System32\vcruntime140_1.dll" -Destination $ReleaseDir

      - name: Archive Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "dist\xaneo-${{ github.ref_name }}-windows-x64.zip"

      - name: Prepare and Build Custom Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "installer_app\assets" | Out-Null
          Copy-Item "dist\xaneo-${{ github.ref_name }}-windows-x64.zip" -Destination "installer_app\assets\xaneo.zip"
          Set-Location -Path "installer_app"
          flutter pub get
          flutter build windows --release

      - name: Bundle VC++ Redistributable (Installer)
        shell: pwsh
        run: |
          $ReleaseDir = "installer_app\build\windows\x64\runner\Release"
          Copy-Item "C:\Windows\System32\msvcp140.dll" -Destination $ReleaseDir
          Copy-Item "C:\Windows\System32\vcruntime140.dll" -Destination $ReleaseDir
          Copy-Item "C:\Windows\System32\vcruntime140_1.dll" -Destination $ReleaseDir

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress

      - name: Build 100% Silent NSIS Wrapper
        shell: pwsh
        run: |
          $Version = "${{ github.ref_name }}".TrimStart("v")
          if ([string]::IsNullOrWhiteSpace($Version) -or $Version -eq "main") { $Version = "1.0.0" }

          # Clean and format version for VIProductVersion (requires 4-part X.Y.Z.W format)
          $CleanVersion = ($Version -replace '[^\d\.]', '')
          if ([string]::IsNullOrWhiteSpace($CleanVersion)) {
              $NsisVersion = "1.0.0.0"
          } else {
              $Parts = $CleanVersion.Split('.')
              while ($Parts.Count -lt 4) {
                  $Parts += "0"
              }
              $NsisVersion = ($Parts[0..3] -join '.')
          }

          if (Get-Command makensis -ErrorAction SilentlyContinue) {
              makensis uninstaller.nsi
              makensis /DVERSION="$NsisVersion" /DDISPLAY_VERSION="$Version" installer.nsi
          } elseif (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") {
              & "C:\Program Files (x86)\NSIS\makensis.exe" uninstaller.nsi
              & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION="$NsisVersion" /DDISPLAY_VERSION="$Version" installer.nsi
          } elseif (Test-Path "C:\Program Files\NSIS\makensis.exe") {
              & "C:\Program Files\NSIS\makensis.exe" uninstaller.nsi
              & "C:\Program Files\NSIS\makensis.exe" /DVERSION="$NsisVersion" /DDISPLAY_VERSION="$Version" installer.nsi
          } else {
              Write-Error "makensis.exe not found! Make sure NSIS is installed correctly."
              exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*.zip
            dist/*.exe
          retention-days: 7


# ==========================================================
#  LINUX — .AppImage  .deb  .rpm
# ==========================================================
  build-linux:
    name: Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            cmake ninja-build clang pkg-config \
            libgtk-3-dev libglib2.0-dev \
            libayatana-appindicator3-dev \
            libnotify-dev \
            libblkid-dev liblzma-dev \
            libmpv-dev libmpv1 \
            rpm dpkg-dev fakeroot \
            wget file

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Set App Version in pubspec.yaml
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then VER="${{ github.ref_name }}"; fi
          VER="${VER#v}"
          if [[ "$VER" =~ ^[0-9]+\.[0-9]+ ]]; then
            echo "Setting app version in pubspec.yaml to: ${VER}+${{ github.run_number }}"
            sed -i "s/^version: .*/version: ${VER}+${{ github.run_number }}/" pubspec.yaml
          fi

      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release
      - run: mkdir -p dist

      - name: Build deb
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9] ]]; then VERSION="0.0.0-${VERSION}"; fi
          BUNDLE="build/linux/x64/release/bundle"
          PKG="dist/deb-build"

          mkdir -p "$PKG/DEBIAN"
          mkdir -p "$PKG/opt/xaneo-pc"
          mkdir -p "$PKG/usr/share/applications"
          mkdir -p "$PKG/usr/share/icons/hicolor/256x256/apps"
          mkdir -p "$PKG/usr/share/icons/hicolor/512x512/apps"
          mkdir -p "$PKG/usr/share/pixmaps"
          mkdir -p "$PKG/usr/bin"

          cp -r "$BUNDLE"/. "$PKG/opt/xaneo-pc/"
          chmod -R 755 "$PKG/opt/xaneo-pc"

          printf '%s\n' \
            '#!/bin/sh' \
            'export LD_LIBRARY_PATH="/opt/xaneo-pc/lib:$LD_LIBRARY_PATH"' \
            'exec /opt/xaneo-pc/xaneo "$@"' \
            > "$PKG/opt/xaneo-pc/xaneo-launcher.sh"
          chmod 755 "$PKG/opt/xaneo-pc/xaneo-launcher.sh"

          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=Xaneo PC' \
            'Comment=Desktop application with onboarding' \
            'Exec=/opt/xaneo-pc/xaneo-launcher.sh' \
            'Icon=xaneo' \
            'StartupWMClass=net.xaneo.pc' \
            'Categories=Utility;' \
            > "$PKG/usr/share/applications/xaneo.desktop"

          cp macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_256.png "$PKG/usr/share/icons/hicolor/256x256/apps/xaneo.png"
          cp macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png "$PKG/usr/share/icons/hicolor/512x512/apps/xaneo.png"
          cp macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png "$PKG/usr/share/pixmaps/xaneo.png"

          ln -sf /opt/xaneo-pc/xaneo-launcher.sh "$PKG/usr/bin/xaneo-pc"

          INSTALLED_SIZE=$(du -sk "$PKG/opt/xaneo-pc" | cut -f1)

          python3 - <<PYEOF
          import os, textwrap
          version = os.environ.get('VERSION', '$VERSION')
          size    = os.environ.get('INSTALLED_SIZE', '$INSTALLED_SIZE')
          pkg     = os.environ.get('PKG', '$PKG')
          control = textwrap.dedent(f"""
              Package: xaneo-pc
              Version: {version}
              Architecture: amd64
              Maintainer: Xaneo <info@xaneo.com>
              Installed-Size: {size}
              Depends: libgtk-3-0, libglib2.0-0, libayatana-appindicator3-1 | libappindicator3-1, libnotify4 | libnotify-bin, libmpv2 | libmpv1
              Section: utils
              Priority: optional
              Homepage: https://xaneo.com
              Description: Xaneo PC - Desktop application with onboarding
               Xaneo PC is a desktop application with onboarding features.
          """).lstrip()
          open(f"{pkg}/DEBIAN/control", "w").write(control)
          postinst = "#!/bin/bash\nchmod 755 /opt/xaneo-pc/xaneo || true\nif [ ! -f /usr/lib/x86_64-linux-gnu/libmpv.so.1 ] && [ -f /usr/lib/x86_64-linux-gnu/libmpv.so.2 ]; then\n  ln -sf /usr/lib/x86_64-linux-gnu/libmpv.so.2 /opt/xaneo-pc/lib/libmpv.so.1 || true\nfi\nupdate-desktop-database /usr/share/applications || true\ngtk-update-icon-cache /usr/share/icons/hicolor || true\n"
          open(f"{pkg}/DEBIAN/postinst", "w").write(postinst)
          os.chmod(f"{pkg}/DEBIAN/postinst", 0o755)
          PYEOF

          fakeroot dpkg-deb --root-owner-group --build "$PKG" "dist/xaneo_${VERSION}_amd64.deb"

      - name: Build rpm
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9] ]]; then VERSION="0.0.0_${VERSION}"; fi
          VERSION="${VERSION//-/_}"
          BUNDLE="build/linux/x64/release/bundle"
          RPM_ROOT="$HOME/rpmbuild"

          mkdir -p "$RPM_ROOT"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

          BUILDROOT="$RPM_ROOT/BUILDROOT/xaneo-pc-${VERSION}-1.x86_64"
          mkdir -p "$BUILDROOT/opt/xaneo-pc"
          mkdir -p "$BUILDROOT/usr/share/applications"
          mkdir -p "$BUILDROOT/usr/bin"
          mkdir -p "$BUILDROOT/usr/share/icons/hicolor/256x256/apps"
          mkdir -p "$BUILDROOT/usr/share/icons/hicolor/512x512/apps"
          mkdir -p "$BUILDROOT/usr/share/pixmaps"

          cp -r "$BUNDLE"/. "$BUILDROOT/opt/xaneo-pc/"

          mkdir -p "$BUILDROOT/opt/xaneo-pc/lib"
          if [ -d /usr/lib/x86_64-linux-gnu ]; then
            cp -d /usr/lib/x86_64-linux-gnu/libmpv.so* "$BUILDROOT/opt/xaneo-pc/lib/" 2>/dev/null || true
          elif [ -d /usr/lib64 ]; then
            cp -d /usr/lib64/libmpv.so* "$BUILDROOT/opt/xaneo-pc/lib/" 2>/dev/null || true
          fi

          chmod -R 755 "$BUILDROOT/opt/xaneo-pc"

          printf '%s\n' \
            '#!/bin/sh' \
            'export LD_LIBRARY_PATH="/opt/xaneo-pc/lib:$LD_LIBRARY_PATH"' \
            'exec /opt/xaneo-pc/xaneo "$@"' \
            > "$BUILDROOT/opt/xaneo-pc/xaneo-launcher.sh"
          chmod 755 "$BUILDROOT/opt/xaneo-pc/xaneo-launcher.sh"

          printf '%s\n' \
            '[Desktop Entry]' \
            'Version=1.0' \
            'Type=Application' \
            'Name=Xaneo PC' \
            'GenericName=Xaneo Messenger' \
            'Comment=Desktop application with onboarding' \
            'Exec=/opt/xaneo-pc/xaneo-launcher.sh' \
            'Icon=xaneo' \
            'StartupWMClass=net.xaneo.pc' \
            'Terminal=false' \
            'Categories=Utility;Network;InstantMessaging;' \
            'Keywords=Xaneo;xaneo;pc;chat;messenger;' \
            > "$BUILDROOT/usr/share/applications/xaneo.desktop"

          cp macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_256.png "$BUILDROOT/usr/share/icons/hicolor/256x256/apps/xaneo.png"
          cp macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png "$BUILDROOT/usr/share/icons/hicolor/512x512/apps/xaneo.png"
          cp macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png "$BUILDROOT/usr/share/pixmaps/xaneo.png"

          ln -sf /opt/xaneo-pc/xaneo-launcher.sh "$BUILDROOT/usr/bin/xaneo-pc"
          ln -sf /opt/xaneo-pc/xaneo-launcher.sh "$BUILDROOT/usr/bin/xaneo"

          DATE=$(date +'%a %b %d %Y')

          python3 - <<PYEOF
          import os
          version   = '$VERSION'
          date      = '$DATE'
          rpm_root  = '$RPM_ROOT'
          buildroot = '$BUILDROOT'
          spec = f"""Name:           xaneo-pc
          Version:        {version}
          Release:        1%{{?dist}}
          Summary:        Xaneo PC - Desktop application with onboarding
          License:        Proprietary
          URL:            https://xaneo.com
          BuildArch:      x86_64

          %global __requires_exclude ^libmpv\\\\.so.*$
          %global __brp_check_rpaths %{{nil}}
          %global debug_package %{{nil}}

          Requires:       gtk3, glib2

          %description
          Xaneo PC is a desktop application with onboarding features.

          %files
          /opt/xaneo-pc/
          /usr/share/applications/xaneo.desktop
          /usr/bin/xaneo-pc
          /usr/bin/xaneo
          /usr/share/icons/hicolor/256x256/apps/xaneo.png
          /usr/share/icons/hicolor/512x512/apps/xaneo.png
          /usr/share/pixmaps/xaneo.png

          %post
          update-desktop-database /usr/share/applications || true
          touch --no-create /usr/share/icons/hicolor || true
          gtk-update-icon-cache /usr/share/icons/hicolor || true

          %changelog
          * {date} CI Build <ci@xaneo.com> - {version}-1
          - Automated build
          """
          open(f"{rpm_root}/SPECS/xaneo-pc.spec", "w").write(spec)
          PYEOF

          QA_RPATHS=0x003f rpmbuild -bb \
            --define "_topdir $RPM_ROOT" \
            --buildroot "$BUILDROOT" \
            "$RPM_ROOT/SPECS/xaneo-pc.spec"

          RPM_FILE=$(find "$RPM_ROOT/RPMS/x86_64" -name "*.rpm" | head -1)
          cp "$RPM_FILE" "dist/xaneo-${VERSION}-1.x86_64.rpm"

      - name: Build AppImage
        run: |
          BUNDLE="build/linux/x64/release/bundle"
          APPDIR="AppImageBuild/xaneo.AppDir"

          # Собираем AppDir по FHS-структуре, которую понимает linuxdeploy
          rm -rf AppImageBuild
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/lib"
          mkdir -p "$APPDIR/usr/share/applications"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          # Бинарник + ассеты + плагины Flutter
          cp -r "$BUNDLE"/. "$APPDIR/usr/bin/"

          # .desktop (генерим в CI, не полагаемся на committed AppDir/)
          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=Xaneo PC' \
            'Comment=Desktop application with onboarding' \
            'Exec=xaneo' \
            'Icon=xaneo' \
            'StartupWMClass=net.xaneo.pc' \
            'Categories=Network;' \
            'Terminal=false' \
            > "$APPDIR/usr/share/applications/xaneo.desktop"
          cp "$APPDIR/usr/share/applications/xaneo.desktop" "$APPDIR/xaneo.desktop"

          mkdir -p "$APPDIR/usr/share/icons/hicolor/512x512/apps"

          cp macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_256.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/xaneo.png"
          cp macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png "$APPDIR/usr/share/icons/hicolor/512x512/apps/xaneo.png"
          cp macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png "$APPDIR/xaneo.png"
          cp macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png "$APPDIR/.DirIcon"

          # Чистый AppRun без запихивания конфликтных системных GTK библиотек
          chmod +x "$APPDIR/usr/bin/xaneo"
          printf '%s\n' \
            '#!/bin/sh' \
            'HERE="$(dirname "$(readlink -f "$0")")"' \
            'export LD_LIBRARY_PATH="$HERE/usr/bin/lib:$LD_LIBRARY_PATH"' \
            'exec "$HERE/usr/bin/xaneo" "$@"' \
            > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

          # Используем официальный appimagetool (без linuxdeploy ABI-конфликтов)
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run "$APPDIR" "dist/xaneo-${{ github.ref_name }}-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          retention-days: 7


# ==========================================================
#  MACOS — .dmg
# ==========================================================
  build-macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Set App Version in pubspec.yaml
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then VER="${{ github.ref_name }}"; fi
          VER="${VER#v}"
          if [[ "$VER" =~ ^[0-9]+\.[0-9]+ ]]; then
            echo "Setting app version in pubspec.yaml to: ${VER}+${{ github.run_number }}"
            sed -i '' "s/^version: .*/version: ${VER}+${{ github.run_number }}/" pubspec.yaml
          fi

      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release

      - name: Create dmg
        run: |
          mkdir -p dist
          hdiutil create \
            -volname "Xaneo PC" \
            -srcfolder "build/macos/Build/Products/Release/xaneo.app" \
            -ov -format UDZO \
            "dist/xaneo-${{ github.ref_name }}-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/xaneo-${{ github.ref_name }}-macos.dmg
          retention-days: 7


# ==========================================================
#  RELEASE — публикуем GitHub Release
# ==========================================================
  release:
    name: GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Upload binaries to VirusTotal & Generate Report Table
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          python3 scripts/virustotal_release.py artifacts release_dist release_body.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest-build' }}
          name: "Xaneo PC ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          body_path: release_body.md
          files: |
            release_dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
